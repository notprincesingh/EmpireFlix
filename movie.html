<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EmpireFlix</title>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<header class="site-header" id="main-nav">

<div class="nav-container">

<a href="index.html" class="brand-logo">

Empire<span class="text-gold">Flix</span>

</a>

<nav class="nav-menu">

<ul class="nav-list">

<li><a href="index.html" class="nav-link">Home</a></li>

<li><a href="search.html" class="nav-link">Search</a></li>

<li><a href="mylist.html" class="nav-link">My List</a></li>

</ul>

</nav>

</div>

</header>

<main class="main-content">

<section class="hero-banner">

<div class="hero-backdrop">

<img id="movie-banner"

class="hero-img"

src=""

alt="">

<div class="hero-vignette"></div>

</div>

<div class="hero-content">

<h1 id="movie-title"

class="hero-title">

</h1>

<div class="hero-meta">

<span id="movie-year"

class="meta-badge"></span>

<span id="movie-rating"

class="meta-badge"></span>

<span id="movie-runtime"

class="meta-badge"></span>

<span id="movie-quality"

class="meta-badge"></span>

</div>

<p id="movie-description"

class="hero-synopsis">

</p>

<div class="hero-actions">

<a

id="play-btn"

class="btn btn-primary"

href="#">

▶ Play

</a>

<button

id="mylist-btn"

class="btn btn-secondary">

+ My List

</button>

</div>

</div>

</section>

<section class="content-row">

<h2 class="row-title">

Credits

</h2>

<div class="glass-panel"

style="padding:25px;">

<p>

<strong>Starring:</strong>

<span id="credits-starring"></span>

</p>

<br>

<p>

<strong>Director:</strong>

<span id="credits-director"></span>

</p>

<br>

<p>

<strong>Writer:</strong>

<span id="credits-writer"></span>

</p>

<br>

<p>

<strong>Editor:</strong>

<span id="credits-editor"></span>

</p>

</div>

</section>

<section class="content-row">

<h2 class="row-title">

More Like This

</h2>

<div class="slider-container">

<div

id="related-track"

class="slider-track">

</div>

</div>

</section>

</main>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/db.js"></script>
<script src="js/movie.js"></script>

</body>

</html>
